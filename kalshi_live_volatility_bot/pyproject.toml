[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-live-volatility-bot"
version = "0.1.0"
description = "KALSHI LIVE VOLATILITY TRADER - standalone live-data / simulated-execution volatility trading research bot"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Only needed for LIVE mode, the demo execution validator, or the authenticated websocket feed.
live = ["cryptography>=42", "websockets>=12"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "cryptography>=42", "websockets>=12"]

[project.scripts]
klvb = "klvb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
klvb = ["dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
